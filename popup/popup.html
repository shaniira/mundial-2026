<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Mundial 2026</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      width: 280px;
      background: #080c0a;
      color: #f0fdf4;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .header {
      background: linear-gradient(135deg, #0d1610 0%, #0a0f0b 100%);
      padding: 18px 16px 14px;
      border-bottom: 1px solid #1a2e1e;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #4ade80, transparent);
    }

    .header-badge {
      font-size: 9px;
      font-weight: 800;
      color: #4ade80;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 900;
      color: #f0fdf4;
      letter-spacing: -0.01em;
    }

    .header-sub {
      font-size: 9px;
      color: #2d4a35;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    /* PARTIDO EN VIVO */
    .live-card {
      margin: 12px;
      background: #050807;
      border: 1px solid #1a2e1e;
      border-radius: 8px;
      overflow: hidden;
    }

    .live-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: #0d1610;
      border-bottom: 1px solid #111e14;
    }

    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ff4444;
      box-shadow: 0 0 6px #ff4444;
      animation: blink 1.2s infinite;
    }

    @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.2} }

    .live-lbl { font-size: 9px; font-weight: 800; color: #ff4444; letter-spacing: 0.12em; }
    .live-min { margin-left: auto; font-size: 9px; color: #2d4a35; font-family: monospace; }

    .live-score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
    }

    .live-team { text-align: center; }
    .live-flag { font-size: 24px; }
    .live-name { font-size: 9px; color: #4ade80; font-weight: 700; letter-spacing: 0.06em; margin-top: 3px; }

    .live-score {
      font-family: 'Courier New', monospace;
      font-size: 32px;
      font-weight: 900;
      color: #f0fdf4;
      text-shadow: 0 0 20px rgba(74,222,128,0.3);
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 1px;
      background: #111e14;
      margin: 0 12px 12px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #1a2e1e;
    }

    .stat {
      background: #050807;
      padding: 10px 6px;
      text-align: center;
    }

    .stat-n { font-size: 18px; font-weight: 900; color: #4ade80; font-family: monospace; }
    .stat-l { font-size: 8px; color: #2d4a35; margin-top: 2px; letter-spacing: 0.06em; text-transform: uppercase; }

    /* PRÓXIMO */
    .proximo-card {
      margin: 0 12px 12px;
      background: rgba(245,158,11,0.05);
      border: 1px solid rgba(245,158,11,0.15);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .prox-lbl { font-size: 8px; color: #f59e0b; letter-spacing: 0.1em; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }

    .prox-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .prox-match { font-size: 12px; color: #f0fdf4; font-weight: 600; }
    .prox-hora  { font-family: monospace; font-size: 14px; color: #f59e0b; font-weight: 700; }

    /* FOOTER */
    .footer {
      display: flex;
      gap: 8px;
      padding: 0 12px 12px;
    }

    .f-btn {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      letter-spacing: 0.02em;
    }
    .f-btn:hover { opacity: 0.8; }

    .f-btn-primary {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
    }

    .f-btn-secondary {
      background: rgba(74,222,128,0.07);
      border: 1px solid #1a2e1e;
      color: #4ade80;
    }

    /* Toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-top: 1px solid #0d1610;
    }

    .toggle-label { font-size: 11px; color: #2d4a35; }

    .toggle { position: relative; width: 36px; height: 20px; cursor: pointer; }
    .toggle input { opacity:0; width:0; height:0; }
    .toggle-slider { position: absolute; inset:0; background:#111e14; border-radius:20px; transition:0.2s; border:1px solid #1a2e1e; }
    .toggle-slider::before { content:''; position:absolute; width:14px; height:14px; left:2px; top:2px; background:#2d4a35; border-radius:50%; transition:0.2s; }
    input:checked + .toggle-slider { background:#166534; border-color:#22c55e; }
    input:checked + .toggle-slider::before { background:#4ade80; transform:translateX(16px); }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-badge">⚽ En Vivo</div>
    <div class="header-title">Mundial 2026</div>
    <div class="header-sub">ESTADIO IA · USA · CANADÁ · MÉXICO</div>
  </div>

  <div id="live-section"></div>

  <div class="stats">
    <div class="stat">
      <div class="stat-n" id="st-vivo">–</div>
      <div class="stat-l">En vivo</div>
    </div>
    <div class="stat">
      <div class="stat-n" id="st-prox">–</div>
      <div class="stat-l">Próximos</div>
    </div>
    <div class="stat">
      <div class="stat-n" id="st-goles">–</div>
      <div class="stat-l">Goles</div>
    </div>
  </div>

  <div id="prox-section"></div>

  <div class="footer">
    <button class="f-btn f-btn-secondary" id="btn-fixture">📅 Fixture</button>
    <button class="f-btn f-btn-primary"   id="btn-abrir">⚽ Abrir Widget</button>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Mostrar widget en páginas</span>
    <label class="toggle">
      <input type="checkbox" id="tog" checked/>
      <span class="toggle-slider"></span>
    </label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
